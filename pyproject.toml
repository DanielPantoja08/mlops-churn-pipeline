[project]
name = "mlops-churn-pipeline"
version = "0.1.0"
description = "Pipeline MLOps end-to-end para predicción de churn, con drift inyectado, monitoreado y reentrenable"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "mlflow>=2.17",
    "google-cloud-secret-manager>=2.20",
]

[dependency-groups]
eda = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.14",
    "jupytext>=1.19.5",
]
monitoring = [
    "evidently>=0.7",
]
dashboard = [
    "streamlit>=1.39",
    "plotly>=5.24",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "dvc[gs]>=3.55",
    "google-cloud-storage>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
